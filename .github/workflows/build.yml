name: build

# Both platforms on every push: the Windows installer, and the universal macOS app with a live check
# on the runner (launch, panes, shortcuts, screenshots in the live-macos artifact). Releases are made
# by `npm run release` on Windows; release-mac.yml adds the Mac build to them.
on:
  push:
    branches: [main, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build universal app (.app, .dmg, .app.tar.gz)
        run: bash tools/ci/mac_build.sh >> "$GITHUB_ENV"
      - name: Install Claude Code (not signed in; its first-run screen is the test)
        run: npm i -g @anthropic-ai/claude-code
      - name: Live checks (launch, panes, shortcuts, screenshots)
        run: bash tools/ci/mac_live.sh "$APP" live-macos
      - name: Dry run of the release step (latest.json of the current release + this build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dry-run
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p latest.json -D dry-run
          # Pretend this build is that release's (only the version check cares).
          v=${tag#v}; t="dry-run/Switchboard_${v}_universal.app.tar.gz"; cp "$TAR" "$t"
          node tools/ci/add-darwin.mjs dry-run/latest.json "$t" "$tag"
          rm "$t"
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-macos-universal
          path: |
            ${{ env.DMG }}
            ${{ env.TAR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-macos
          path: live-macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dry-run
          path: dry-run
